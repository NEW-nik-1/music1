<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUZER play</title>

<!-- MP3 encoder -->
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.all.min.js"></script>

<!-- VK Bridge -->
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    linear-gradient(rgba(45,22,8,.25),rgba(45,22,8,.25)),
    repeating-linear-gradient(
      90deg,
      #7b431d 0,
      #8d5228 35px,
      #6d3715 70px,
      #92552b 105px
    );
  color:#24150b;
  padding:10px;
}

button,
input,
select{
  font:inherit;
}

.app{
  width:min(1180px,100%);
  height:calc(100vh - 20px);
  margin:auto;
  display:flex;
  flex-direction:column;
  background:#d7a263;
  border:5px solid #4a2612;
  border-radius:12px;
  box-shadow:
    0 12px 30px rgba(0,0,0,.45),
    inset 0 0 0 2px #b8783b;
  overflow:hidden;
}

.header{
  min-height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:8px 14px;
  background:linear-gradient(#a86632,#754018);
  color:#fff3dc;
  border-bottom:4px solid #4a2612;
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:1px;
  text-shadow:2px 2px #3a1c0c;
}

.logo span{
  color:#ffd889;
}

.status{
  font-size:12px;
  font-weight:bold;
  text-align:right;
}

.workspace{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:10px;
  padding:10px;
}

.panel{
  min-height:0;
  background:
    linear-gradient(rgba(255,220,165,.38),rgba(255,220,165,.38)),
    repeating-linear-gradient(
      0deg,
      #bd7d40 0,
      #bd7d40 4px,
      #b57438 4px,
      #b57438 8px
    );
  border:3px solid #603313;
  border-radius:9px;
  box-shadow:
    inset 0 0 0 2px rgba(255,221,166,.35),
    0 4px 10px rgba(0,0,0,.22);
  padding:10px;
  overflow:auto;
}

.panel::-webkit-scrollbar{
  width:7px;
}

.panel::-webkit-scrollbar-thumb{
  background:#70401e;
  border-radius:10px;
}

.section-title{
  margin:0 0 7px;
  font-size:14px;
  font-weight:900;
  text-transform:uppercase;
  color:#44220e;
  letter-spacing:.6px;
}

.file-box{
  display:grid;
  grid-template-columns:1fr auto;
  gap:7px;
  align-items:center;
  margin-bottom:8px;
}

.file-label{
  display:block;
  padding:9px 11px;
  background:#f2cf9b;
  border:2px solid #633617;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.file-label:hover{
  background:#ffe0ad;
}

.file-input{
  display:none;
}

.filename{
  min-width:0;
  padding:8px;
  background:#422310;
  color:#ffe7bd;
  border-radius:5px;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.transport{
  display:grid;
  grid-template-columns:1.3fr .7fr;
  gap:7px;
  margin-bottom:8px;
}

.play-button,
.ab-button{
  border:3px solid #42200e;
  border-radius:7px;
  padding:11px 8px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 3px 0 #2a1308;
}

.play-button{
  background:#e2a62f;
  color:#301805;
  font-size:18px;
}

.play-button:active,
.ab-button:active,
.mode-button:active,
.export-button:active,
.random-button:active{
  transform:translateY(2px);
  box-shadow:0 1px 0 #2a1308;
}

.ab-button{
  background:#7d431d;
  color:#fff0cf;
}

.ab-controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-bottom:9px;
}

.mode-button{
  border:2px solid #5a2d13;
  border-radius:5px;
  background:#c18446;
  color:#321707;
  padding:7px;
  cursor:pointer;
  font-weight:900;
}

.mode-button.active{
  background:#f3c66c;
  box-shadow:inset 0 0 0 2px #6b3615;
}

.control{
  margin-bottom:7px;
}

.control-row{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center;
  font-size:12px;
  font-weight:900;
}

.value{
  min-width:55px;
  text-align:right;
  color:#54260e;
}

input[type="range"]{
  width:100%;
  accent-color:#633313;
  cursor:pointer;
}

select,
input[type="text"]{
  width:100%;
  border:2px solid #653617;
  border-radius:5px;
  background:#f5d6a3;
  color:#2c1608;
  padding:7px 8px;
  outline:none;
}

select:focus,
input[type="text"]:focus{
  border-color:#351706;
  background:#ffe5ba;
}

.preset-wrap{
  margin-top:8px;
}

.metadata{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.field{
  min-width:0;
}

.field.full{
  grid-column:1 / -1;
}

.field label{
  display:block;
  margin-bottom:3px;
  font-size:11px;
  font-weight:900;
  color:#48220d;
}

.uuid-row{
  display:grid;
  grid-template-columns:1fr 42px;
  gap:5px;
}

.random-button{
  border:2px solid #54290f;
  border-radius:5px;
  background:#d99746;
  color:#2e1507;
  cursor:pointer;
  font-size:18px;
  font-weight:900;
}

.export-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:9px;
}

.export-box{
  padding:8px;
  border:2px solid #603313;
  border-radius:6px;
  background:rgba(255,224,177,.45);
}

.export-title{
  font-size:13px;
  font-weight:900;
  margin-bottom:5px;
}

.export-button{
  width:100%;
  margin-top:6px;
  padding:9px;
  border:3px solid #42200e;
  border-radius:6px;
  background:#d88e28;
  color:#2c1506;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 3px 0 #2a1308;
}

.export-button:disabled,
.play-button:disabled,
.ab-button:disabled,
.mode-button:disabled,
.random-button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.progress-area{
  margin-top:9px;
  padding:8px;
  background:#4a2814;
  color:#ffe6bd;
  border-radius:6px;
}

.progress-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:11px;
  font-weight:900;
  margin-bottom:5px;
}

.progress-track{
  height:10px;
  overflow:hidden;
  background:#251307;
  border:1px solid #1a0c04;
  border-radius:10px;
}

.progress-fill{
  width:0%;
  height:100%;
  background:#e9ae4e;
  transition:width .15s linear;
}

.progress-fill.indeterminate{
  width:35%;
  animation:progressMove 1s linear infinite;
}

@keyframes progressMove{
  0%{transform:translateX(-120%);}
  100%{transform:translateX(380%);}
}

.footer{
  flex:none;
  padding:5px 10px;
  background:#4c2813;
  color:#eac58d;
  font-size:10px;
  text-align:center;
  border-top:3px solid #311607;
}

@media(max-width:850px){
  html,
  body{
    overflow:auto;
    height:auto;
    min-height:100%;
  }

  body{
    padding:6px;
  }

  .app{
    height:auto;
    min-height:calc(100vh - 12px);
  }

  .workspace{
    grid-template-columns:1fr;
  }

  .panel{
    overflow:visible;
  }
}

@media(max-width:500px){
  .header{
    flex-direction:column;
    align-items:flex-start;
  }

  .status{
    text-align:left;
  }

  .metadata,
  .export-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .file-box{
    grid-template-columns:1fr;
  }
}

/* MUZER play — plain text logo */

.logo{
  display:inline-flex;
  align-items:center;
  width:auto;
  height:auto;
  padding:0;
  background:none;
  border:0;
  box-shadow:none;
  color:#f0d2a5;
  font-size:20px;
  font-weight:900;
  letter-spacing:.5px;
  text-shadow:0 1px 2px #000;
}
</style>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="logo">
      COMPACT DARK <span>WOOD</span>
    </div>

    <div class="status" id="status">
      ГОТОВ К РАБОТЕ
    </div>

  </header>

  <main class="workspace">

    <!-- LEFT -->

    <section class="panel">

      <h2 class="section-title">
        Трек
      </h2>

      <div class="file-box">

        <label class="file-label">
          📂 ВЫБРАТЬ АУДИО

          <input
            class="file-input"
            id="fileInput"
            type="file"
            accept="audio/*,.mp3,.wav,.m4a,.aac,.flac,.ogg"
          >
        </label>

        <div
          class="filename"
          id="fileName"
        >
          Файл не выбран
        </div>

      </div>

      <div class="transport">

        <button
          class="play-button"
          id="playButton"
          disabled
        >
          ▶ PLAY
        </button>

        <button
          class="ab-button"
          id="abButton"
          disabled
        >
          A/B
        </button>

      </div>

      <div class="ab-controls">

        <button
          class="mode-button active"
          id="modeA"
          disabled
        >
          A · ДО
        </button>

        <button
          class="mode-button"
          id="modeB"
          disabled
        >
          B · ПОСЛЕ
        </button>

      </div>

      <h2 class="section-title">
        Mastering
      </h2>

      <div class="control">

        <div class="control-row">
          <span>Bass</span>
          <span
            class="value"
            id="bassValue"
          >
            0.0 dB
          </span>
        </div>

        <input
          id="bass"
          type="range"
          min="-12"
          max="12"
          step="0.1"
          value="0"
        >

      </div>

      <div class="control">

        <div class="control-row">
          <span>Mid</span>
          <span
            class="value"
            id="midValue"
          >
            0.0 dB
          </span>
        </div>

        <input
          id="mid"
          type="range"
          min="-12"
          max="12"
          step="0.1"
          value="0"
        >

      </div>

      <div class="control">

        <div class="control-row">
          <span>Treble</span>
          <span
            class="value"
            id="trebleValue"
          >
            0.0 dB
          </span>
        </div>

        <input
          id="treble"
          type="range"
          min="-12"
          max="12"
          step="0.1"
          value="0"
        >

      </div>

      <div class="control">

        <div class="control-row">
          <span>Intensity</span>
          <span
            class="value"
            id="intensityValue"
          >
            100%
          </span>
        </div>

        <input
          id="intensity"
          type="range"
          min="0"
          max="100"
          step="1"
          value="100"
        >

      </div>

      <div class="control">

        <div class="control-row">
          <span>Master</span>
          <span
            class="value"
            id="masterValue"
          >
            0.0 dB
          </span>
        </div>

        <input
          id="master"
          type="range"
          min="-12"
          max="6"
          step="0.1"
          value="0"
        >

      </div>

      <div class="preset-wrap">

        <div class="control-row">
          <span>Preset</span>
        </div>

        <select id="preset">
          <option value="manual">
            Manual
          </option>

          <option value="balanced">
            Balanced
          </option>

          <option value="warm">
            Warm
          </option>

          <option value="bright">
            Bright
          </option>

          <option
            value="clear-studio"
            selected
          >
            CLEAR STUDIO
          </option>
        </select>

      </div>

    </section>


    <!-- RIGHT -->

    <section class="panel">

      <h2 class="section-title">
        Metadata
      </h2>

      <div class="metadata">

        <div class="field full">

          <label for="title">
            Title — оригинальное название
          </label>

          <input
            id="title"
            type="text"
            autocomplete="off"
          >

        </div>

        <div class="field">

          <label for="artist">
            Artist — оригинальный артист / исполнитель
          </label>

          <input
            id="artist"
            type="text"
            autocomplete="off"
          >

        </div>

        <div class="field">

          <label for="album">
            Album — альбом
          </label>

          <input
            id="album"
            type="text"
            autocomplete="off"
          >

        </div>

        <div class="field">

          <label for="trackNumber">
            Track Number — номер трека
          </label>

          <input
            id="trackNumber"
            type="text"
            inputmode="numeric"
            autocomplete="off"
          >

        </div>

        <div class="field">

          <label for="composer">
            Composer — автор
          </label>

          <input
            id="composer"
            type="text"
            autocomplete="off"
          >

        </div>

        <div class="field">

          <label for="albumArtist">
            Album Artist
          </label>

          <input
            id="albumArtist"
            type="text"
            autocomplete="off"
          >

        </div>

        <div class="field full">

          <label for="uuid">
            MusicBrainz Track ID / Random ID
          </label>

          <div class="uuid-row">

            <input
              id="uuid"
              type="text"
              autocomplete="off"
            >

            <button
              class="random-button"
              id="randomId"
              type="button"
              title="Создать новый UUID"
            >

/* =========================================================

function ensureAudioContext(){

  if(!audioContext){

    const AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioCtx){

      throw new Error(
        "Web Audio API не поддерживается этим браузером."
      );

    }

    audioContext =
      new AudioCtx();

  }

  return audioContext;
}


/* =========================================================
   UUID v4
========================================================= */

function generateMusicBrainzTrackId(){

  if(
    window.crypto &&
    typeof crypto.randomUUID === "function"
  ){

    return crypto.randomUUID();

  }

  const bytes =
    new Uint8Array(16);

  if(
    window.crypto &&
    typeof crypto.getRandomValues === "function"
  ){

    crypto.getRandomValues(bytes);

  }else{

    for(
      let i = 0;
      i < 16;
      i++
    ){

      bytes[i] =
        Math.floor(
          Math.random() * 256
        );

    }

  }

  bytes[6] =
    (bytes[6] & 0x0f) | 0x40;

  bytes[8] =
    (bytes[8] & 0x3f) | 0x80;

  const hex =
    Array.from(bytes)
      .map(
        b =>
          b.toString(16)
            .padStart(2,"0")
      )
      .join("");

  return (
    hex.slice(0,8) + "-" +
    hex.slice(8,12) + "-" +
    hex.slice(12,16) + "-" +
    hex.slice(16,20) + "-" +
    hex.slice(20,32)
  );
}

/* =========================================================
   DB
========================================================= */

function dbToGain(db){

  return Math.pow(
    10,
    Number(db) / 20
  );

}


/* =========================================================
   CREATE LIVE PROCESSING CHAIN
========================================================= */

function createProcessingChain(){

  const ctx =
    ensureAudioContext();

  bassFilter =
    ctx.createBiquadFilter();

  bassFilter.type =
    "lowshelf";

  bassFilter.frequency.value =
    120;

  bassFilter.gain.value =
    Number(bass.value);


  midFilter =
    ctx.createBiquadFilter();

  midFilter.type =
    "peaking";

  midFilter.frequency.value =
    1000;

  midFilter.Q.value =
    0.8;

  midFilter.gain.value =
    Number(mid.value);


  trebleFilter =
    ctx.createBiquadFilter();

  trebleFilter.type =
    "highshelf";

  trebleFilter.frequency.value =
    6500;

  trebleFilter.gain.value =
    Number(treble.value);


  compressor =
    ctx.createDynamicsCompressor();

  compressor.threshold.value =
    -18;

  compressor.knee.value =
    10;

  compressor.ratio.value =
    3;

  compressor.attack.value =
    0.003;

  compressor.release.value =
    0.15;


  /* FIX:
     limiter must be declared.
  */

  limiter =
    ctx.createDynamicsCompressor();

  limiter.threshold.value =
    -2;

  limiter.knee.value =
    0;

  limiter.ratio.value =
    20;

  limiter.attack.value =
    0.001;

  limiter.release.value =
    0.08;


  masterGain =
    ctx.createGain();

  masterGain.gain.value =
    dbToGain(
      Number(master.value)
    );


  bassFilter.connect(
    midFilter
  );

  midFilter.connect(
    trebleFilter
  );

  trebleFilter.connect(
    compressor
  );

  compressor.connect(
    limiter
  );

  limiter.connect(
    masterGain
  );

}


function updateAudioProcessing(){

  if(!audioContext){
    return;
  }

  if(!bassFilter){
    return;
  }

  const now =
    audioContext.currentTime;

  bassFilter.gain.setTargetAtTime(
    Number(bass.value),
    now,
    0.01
  );

  midFilter.gain.setTargetAtTime(
    Number(mid.value),
    now,
    0.01
  );

  trebleFilter.gain.setTargetAtTime(
    Number(treble.value),
    now,
    0.01
  );

  masterGain.gain.setTargetAtTime(
    dbToGain(
      Number(master.value)
    ),
    now,
    0.01
  );

  if(wetLiveGain && dryLiveGain){

    const wet =
      Number(intensity.value) / 100;

    const dry =
      1 - wet;

    wetLiveGain.gain.setTargetAtTime(
      wet,
      now,
      0.01
    );

    dryLiveGain.gain.setTargetAtTime(
      dry,
      now,
      0.01
    );

  }

}


/* =========================================================
   LIVE PLAYBACK GRAPH
========================================================= */

function buildPlaybackGraph(){

  const ctx =
    ensureAudioContext();

  createProcessingChain();

  originalGain =
    ctx.createGain();

  processedGain =
    ctx.createGain();

  dryLiveGain =
    ctx.createGain();

  wetLiveGain =
    ctx.createGain();


  originalGain.gain.value =
    activeMode === "A"
      ? 1
      : 0;

  processedGain.gain.value =
    activeMode === "B"
      ? 1
      : 0;


  dryLiveGain.gain.value =
    1 -
    Number(intensity.value) / 100;

  wetLiveGain.gain.value =
    Number(intensity.value) / 100;


  originalGain.connect(
    ctx.destination
  );

  masterGain.connect(
    wetLiveGain
  );

  wetLiveGain.connect(
    processedGain
  );

  dryLiveGain.connect(
    processedGain
  );

  processedGain.connect(
    ctx.destination
  );

}


/* =========================================================
   START PLAYBACK
========================================================= */

async function startPlayback(){

  if(!audioBuffer){
    return;
  }

  const ctx =
    ensureAudioContext();

  if(ctx.state === "suspended"){
    await ctx.resume();
  }

  stopPlaybackSources(false);

  buildPlaybackGraph();

  const remaining =
    Math.max(
      0,
      audioBuffer.duration -
      playbackOffset
    );

  if(remaining <= 0.01){
    playbackOffset = 0;
  }

  const offset =
    playbackOffset;

  originalSource =
    ctx.createBufferSource();

  processedSource =
    ctx.createBufferSource();

  originalSource.buffer =
    audioBuffer;

  processedSource.buffer =
    audioBuffer;


  originalSource.connect(
    originalGain
  );

  processedSource.connect(
    bassFilter
  );


  const now =
    ctx.currentTime;

  originalSource.start(
    now,
    offset
  );

  processedSource.start(
    now,
    offset
  );

  playbackStartedAt =
    now - offset;

  isPlaying = true;

  playButton.textContent =
    "❚❚ PAUSE";

  status.textContent =
    activeMode === "A"
      ? "ИГРАЕТ · ДО"
      : "ИГРАЕТ · ПОСЛЕ";


  originalSource.onended =
    () => {

      if(!isPlaying){
        return;
      }

      const elapsed =
        ctx.currentTime -
        playbackStartedAt;

      if(
        elapsed >=
        audioBuffer.duration - 0.05
      ){

        isPlaying = false;

        playbackOffset = 0;

        playButton.textContent =
          "▶ PLAY";

        status.textContent =
          "ГОТОВ";

      }

    };

}


/* =========================================================
   STOP PLAYBACK
========================================================= */

function stopPlaybackSources(
  resetPosition = false
){

  if(originalSource){

    try{

      originalSource.onended =
        null;

      originalSource.stop();

    }catch(e){}

    try{
      originalSource.disconnect();
    }catch(e){}

    originalSource = null;

  }


  if(processedSource){

    try{
      processedSource.stop();
    }catch(e){}

    try{
      processedSource.disconnect();
    }catch(e){}

    processedSource = null;

  }


  if(audioContext){

    const nodes = [

      originalGain,
      processedGain,
      dryLiveGain,
      wetLiveGain,
      masterGain,
      bassFilter,
      midFilter,
      trebleFilter,
      compressor,
      limiter

    ];

    nodes.forEach(
      node => {

        if(node){

          try{
            node.disconnect();
          }catch(e){}

        }

      }
    );

  }


  originalGain = null;
  processedGain = null;

  dryLiveGain = null;
  wetLiveGain = null;

  bassFilter = null;
  midFilter = null;
  trebleFilter = null;

  compressor = null;
  limiter = null;
  masterGain = null;


  if(resetPosition){
    playbackOffset = 0;
  }

}


/* =========================================================
   PAUSE
========================================================= */

function pausePlayback(){

  if(!isPlaying){
    return;
  }

  const ctx =
    ensureAudioContext();

  playbackOffset =
    Math.max(
      0,
      Math.min(
        audioBuffer.duration,
        ctx.currentTime -
        playbackStartedAt
      )
    );

  isPlaying = false;

  stopPlaybackSources(false);

  playButton.textContent =
    "▶ PLAY";

  status.textContent =
    "ПАУЗА";

}


/* =========================================================
   TOGGLE
========================================================= */

async function togglePlayback(){

  if(!audioBuffer){
    return;

  if(isPlaying){

    pausePlayback();

  }else{

    await startPlayback();

  }

}


/* =========================================================
   A/B
========================================================= */

function switchMode(mode){

  activeMode =
    mode === "B"
      ? "B"
      : "A";

  modeA.classList.toggle(
    "active",
    activeMode === "A"
  );

  modeB.classList.toggle(
    "active",
    activeMode === "B"
  );


  if(
    isPlaying &&
    audioContext &&
    originalGain &&
    processedGain
  ){

    const now =
      audioContext.currentTime;

    const fade =
      0.008;

    if(activeMode === "A"){

      originalGain.gain.cancelScheduledValues(now);

      processedGain.gain.cancelScheduledValues(now);

      originalGain.gain.setTargetAtTime(
        1,
        now,
        fade
      );

      processedGain.gain.setTargetAtTime(
        0,
        now,
        fade
      );

      status.textContent =
        "ИГРАЕТ · ДО";

    }else{

      originalGain.gain.cancelScheduledValues(now);

      processedGain.gain.cancelScheduledValues(now);

      originalGain.gain.setTargetAtTime(
        0,
        now,
        fade
      );

      processedGain.gain.setTargetAtTime(
        1,
        now,
        fade
      );

      status.textContent =
        "ИГРАЕТ · ПОСЛЕ";

    }

  }else{

    status.textContent =
      activeMode === "A"
        ? "РЕЖИМ · ДО"
        : "РЕЖИМ · ПОСЛЕ";

  }

}


/* =========================================================
   ID3 HELPERS
========================================================= */

function readSynchsafe(
  bytes,
  offset
){

  return (
    ((bytes[offset] & 0x7f) << 21) |
    ((bytes[offset + 1] & 0x7f) << 14) |
    ((bytes[offset + 2] & 0x7f) << 7) |
    (bytes[offset + 3] & 0x7f)
  );

}


function decodeId3Text(bytes){

  if(!bytes || !bytes.length){
    return "";
  }

  const enc =
    bytes[0];

  const body =
    bytes.slice(1);

  try{

    if(enc === 0){

      return new TextDecoder(
        "iso-8859-1"
      )
        .decode(body)
        .replace(/\0/g,"")
        .trim();

    }

    if(enc === 1){

      return new TextDecoder(
        "utf-16"
      )
        .decode(body)
        .replace(/\0/g,"")
        .trim();

    }

    if(enc === 2){

      return new TextDecoder(
        "utf-16be"
      )
        .decode(body)
        .replace(/\0/g,"")
        .trim();

    }

    return new TextDecoder(
      "utf-8"
    )
      .decode(body)
      .replace(/\0/g,"")
      .trim();

  }catch(e){

    return "";

  }

}


function isHiddenAiTxxx(description){

  const d =
    String(description || "")
      .trim()
      .toLowerCase();

  return (
    d === "ai" ||
    d === "ai tag" ||
    d === "ai-tag" ||
    d === "aitag" ||
    d === "hidden ai"
  );

}


/* =========================================================
   PARSE ORIGINAL ID3
========================================================= */

function parseOriginalId3(
  arrayBuffer
){

  const bytes =
    new Uint8Array(arrayBuffer);

  if(
    bytes.length < 10 ||
    bytes[0] !== 0x49 ||
    bytes[1] !== 0x44 ||
    bytes[2] !== 0x33
  ){

    return {
      metadata:{},
      tagBytes:null
    };

  }

  const version =
    bytes[3];

  const flags =
    bytes[5];

  const tagSize =
    readSynchsafe(
      bytes,
      6
    );

  const end =
    Math.min(
      bytes.length,
      10 + tagSize
    );

  const metadata = {};

  let pos = 10;

  while(
    pos + 10 <= end
  ){

    if(
      bytes[pos] === 0 &&
      bytes[pos + 1] === 0 &&
      bytes[pos + 2] === 0 &&
      bytes[pos + 3] === 0
    ){
      break;
    }

    const id =
      String.fromCharCode(
        bytes[pos],
        bytes[pos + 1],
        bytes[pos + 2],
        bytes[pos + 3]
      );

    let size;

    if(version >= 4){

      size =
        readSynchsafe(
          bytes,
          pos + 4
        );

    }else{

      size =
        (
          (bytes[pos + 4] << 24) >>> 0
        ) +
        (bytes[pos + 5] << 16) +
        (bytes[pos + 6] << 8) +
        bytes[pos + 7];

    }

    if(
      size <= 0 ||
      pos + 10 + size > end
    ){
      break;
    }

    const payload =
      bytes.slice(
        pos + 10,
        pos + 10 + size
      );

    if(id === "TIT2"){
      metadata.title =
        decodeId3Text(payload);
    }

    else if(id === "TPE1"){
      metadata.artist =
        decodeId3Text(payload);
    }

    else if(id === "TCOM"){
      metadata.composer =
        decodeId3Text(payload);
    }

    pos +=
      10 + size;

  }

  return {
    metadata,
    tagBytes:
      bytes.slice(0,end),
    version,
    flags
  };

}


/* =========================================================
   LICENSE / AI FILTER
========================================================= */

function isLicenseFrame(
  id,
  payload
){

  if(id === "COMM"){

    const value =
      decodeId3Text(
        payload.slice(4)
      );

    return /license|licence|rights|copyright/i
      .test(value);

  }

  if(id === "TXXX"){

    const enc =
      payload[0];

    let zero = -1;

    for(
      let i = 1;
      i < payload.length;
      i++
    ){

      if(payload[i] === 0){

        zero = i;
        break;

      }

    }

    if(zero > 0){

      const desc =
        decodeId3Text(
          new Uint8Array([
            enc,
            ...payload.slice(
              1,
              zero
            )
          ])
        );

      return /license|licence|rights|copyright/i
        .test(desc);

    }

  }

  return false;

}


function filterHiddenAiFromId3(
  tagBytes
){

  if(
    !tagBytes ||
    tagBytes.length < 10
  ){
    return null;
  }

  const bytes =
    new Uint8Array(tagBytes);

  if(
    bytes[0] !== 0x49 ||
    bytes[1] !== 0x44 ||
    bytes[2] !== 0x33
  ){
    return bytes;
  }

  const version =
    bytes[3];

  const tagSize =
    readSynchsafe(
      bytes,
      6
    );

  const end =
    Math.min(
      bytes.length,
      10 + tagSize
    );

  const frames = [];

  let pos = 10;

  while(
    pos + 10 <= end
  ){

    if(
      bytes[pos] === 0 &&
      bytes[pos+1] === 0 &&
      bytes[pos+2] === 0 &&
      bytes[pos+3] === 0
    ){
      break;
    }

    const id =
      String.fromCharCode(
        bytes[pos],
        bytes[pos+1],
        bytes[pos+2],
        bytes[pos+3]
      );

    const size =
      version >= 4
        ? readSynchsafe(
            bytes,
            pos + 4
          )
        :
          (
            ((bytes[pos+4] << 24) >>> 0) +
            (bytes[pos+5] << 16) +
            (bytes[pos+6] << 8) +
            bytes[pos+7]
          );

    if(
      size <= 0 ||
      pos + 10 + size > end
    ){
      break;
    }

    const frame =
      bytes.slice(
        pos,
        pos + 10 + size
      );

    const payload =
      bytes.slice(
        pos + 10,
        pos + 10 + size
      );

    let remove = false;

    if(id === "TXXX"){

      let zero = -1;

      for(
        let i = 1;
        i < payload.length;
        i++
      ){

        if(payload[i] === 0){

          zero = i;
          break;

        }

      }

      if(zero > 0){

        const enc =
          payload[0];

        const desc =
          decodeId3Text(
            new Uint8Array([
              enc,
              ...payload.slice(
                1,
                zero
              )
            ])
          );

        remove =
          isHiddenAiTxxx(desc);

      }

    }

    if(
      isLicenseFrame(
        id,
        payload
      )
    ){

      remove = true;

    }

    if(!remove){

      frames.push(frame);

    }

    pos +=
      10 + size;

  }

  let total = 0;

  for(
    const f of frames
  ){
    total += f.length;
  }

  const out =
    new Uint8Array(
      10 + total
    );

  out.set(
    bytes.slice(0,10),
    0
  );

  out.set(
    new Uint8Array([
      0x49,
      0x44,
      0x33,
      bytes[3],
      bytes[4],
      bytes[5],
      ...synchsafe(total)
    ]),
    0
  );

  let o = 10;

  for(
    const f of frames
  ){

    out.set(
      f,
      o
    );

    o +=
      f.length;

  }

  return out;

}


/* =========================================================
   UTF-8 / SYNCHSAFE
========================================================= */

function encodeUtf8(text){

  return new TextEncoder()
    .encode(
      String(text || "")
    );

}


function synchsafe(value){

  return new Uint8Array([
    (value >> 21) & 0x7f,
    (value >> 14) & 0x7f,
    (value >> 7) & 0x7f,
    value & 0x7f
  ]);

}


/* =========================================================
   ID3 FRAME
========================================================= */

function createId3Frame(
  id,
  text,
  description = null
){

  let payload;

  if(id === "TXXX"){

    const desc =
      encodeUtf8(
        description || ""
      );

    const value =
      encodeUtf8(
        text || ""
      );

    payload =
      new Uint8Array(
        1 +
        desc.length +
        1 +
        value.length
      );

    payload[0] =
      3;

    payload.set(
      desc,
      1
    );

    payload[
      1 + desc.length
    ] = 0;

    payload.set(
      value,
      2 + desc.length
    );

  }else{

    const value =
      encodeUtf8(
        text || ""
      );

    payload =
      new Uint8Array(
        1 + value.length
      );

    payload[0] =
      3;

    payload.set(
      value,
      1
    );

  }

  const frame =
    new Uint8Array(
      10 + payload.length
    );

  for(
    let i = 0;
    i < 4;
    i++
  ){

    frame[i] =
      id.charCodeAt(i);

  }

  const size =
    synchsafe(
      payload.length
    );

  frame.set(
    size,
    4
  );

  frame[8] = 0;
  frame[9] = 0;

  frame.set(
    payload,
    10
  );

  return frame;

}

function createCleanId3Tag(){

    uuidInput.value.trim();

      )
    );

  }

  if(artist){

    frames.push(
      createId3Frame(
        "TPE1",
        artist
      )
    );

  }

  if(album){

    frames.push(
      createId3Frame(
        "TALB",
        album
      )
    );

  }

  if(track){

    frames.push(
      createId3Frame(
        "TRCK",
        track
      )
    );

  }

  if(composer){

    frames.push(
      createId3Frame(

      )
    );

  }

    frames.push(

      )

  }

    createId3Frame(
      "TCOP",
      "MUZER play"
    )
  );


  let totalSize = 0;

  for(
    const frame of frames
  ){

    totalSize +=
      frame.length;

  }


  const header =
    new Uint8Array(10);

  header[0] =
    0x49;

  header[1] =
    0x44;

  header[2] =
    0x33;

  header[3] =
    4;

  header[4] =
    0;

  header[5] =
    0;

  header.set(
    synchsafe(totalSize),
    6
  );


  const tag =
    new Uint8Array(
      10 + totalSize
    );

  tag.set(
    header,
    0
  );

  let offset = 10;

  for(
    const frame of frames
  ){

    tag.set(
      frame,
      offset
    );

    offset +=
      frame.length;

  }

  return tag;

}


/* =========================================================
   COPYRIGHT
========================================================= */

function ensureCopyrightInId3(
  tagBytes
){

  const copyright =
    "MUZER play";

  if(
    !tagBytes ||
    tagBytes.length < 10
  ){

    return createCleanId3Tag();

  }

  const bytes =
    new Uint8Array(tagBytes);

  if(
    bytes[0] !== 0x49 ||
    bytes[1] !== 0x44 ||
    bytes[2] !== 0x33
  ){

    return createCleanId3Tag();

  }

  const version =
    bytes[3];

  const tagSize =
    readSynchsafe(
      bytes,
      6
    );

  const end =
    Math.min(
      bytes.length,
      10 + tagSize
    );

  const frames = [];

  let pos = 10;

  let hasCopyright = false;

  while(
    pos + 10 <= end
  ){

    if(
      bytes[pos] === 0 &&
      bytes[pos+1] === 0 &&
      bytes[pos+2] === 0 &&
      bytes[pos+3] === 0
    ){
      break;
    }

    const id =
      String.fromCharCode(
        bytes[pos],
        bytes[pos+1],
        bytes[pos+2],
        bytes[pos+3]
      );

    const size =
      version >= 4
        ? readSynchsafe(
            bytes,
            pos + 4
          )
        :
          (
            ((bytes[pos+4] << 24) >>> 0) +
            (bytes[pos+5] << 16) +
            (bytes[pos+6] << 8) +
            bytes[pos+7]
          );

    if(
      size <= 0 ||
      pos + 10 + size > end
    ){
      break;
    }

    const frame =
      bytes.slice(
        pos,
        pos + 10 + size
      );

    if(id === "TCOP"){
      hasCopyright = true;
    }

    frames.push(frame);

    pos +=
      10 + size;

  }

  if(hasCopyright){

    return bytes.slice(
      0,
      end
    );

  }


  frames.push(
    createId3Frame(
      "TCOP",
      copyright
    )
  );


  let totalSize = 0;

  for(
    const frame of frames
  ){

    totalSize +=
      frame.length;

  }


  const header =
    bytes.slice(
      0,
      10
    );

  header.set(
    synchsafe(totalSize),
    6
  );


  const out =
    new Uint8Array(
      10 + totalSize
    );

  out.set(
    header,
    0
  );

  let offset = 10;

  for(
    const frame of frames
  ){

    out.set(
      frame,
      offset
    );

    offset +=
      frame.length;

  }

  return out;

}

/* =========================================================
   DURATION
========================================================= */

function formatDuration(
  seconds
){

  if(!Number.isFinite(seconds)){
    return "0:00";
  }

  const total =
    Math.floor(seconds);

  const minutes =
    Math.floor(total / 60);

  const secs =
    total % 60;

  return (
    minutes +
    ":" +
    String(secs)
      .padStart(2,"0")
  );

}


/* =========================================================
   OFFLINE MASTERING
========================================================= */

async function renderMasteredAudio(){

  if(!audioBuffer){

    throw new Error(
      "Аудиофайл не загружен."
    );

  }

  const channels =
    audioBuffer.numberOfChannels;

  const sampleRate =
    audioBuffer.sampleRate;

  const length =
    audioBuffer.length;

  const OfflineCtx =
    window.OfflineAudioContext ||
    window.webkitOfflineAudioContext;

  if(!OfflineCtx){

    throw new Error(
      "OfflineAudioContext не поддерживается."
    );

  }

  const offline =
    new OfflineCtx(
      channels,
      length,
      sampleRate
    );


  const source =
    offline.createBufferSource();

  source.buffer =
    audioBuffer;


  const bassNode =
    offline.createBiquadFilter();

  bassNode.type =
    "lowshelf";

  bassNode.frequency.value =
    120;

  bassNode.gain.value =
    Number(bass.value);


  const midNode =
    offline.createBiquadFilter();

  midNode.type =
    "peaking";

  midNode.frequency.value =
    1000;

  midNode.Q.value =
    0.8;

  midNode.gain.value =
    Number(mid.value);


  const trebleNode =
    offline.createBiquadFilter();

  trebleNode.type =
    "highshelf";

  trebleNode.frequency.value =
    6500;

  trebleNode.gain.value =
    Number(treble.value);


  const comp =
    offline.createDynamicsCompressor();

  comp.threshold.value =
    -14;

  comp.knee.value =
    8;

  comp.ratio.value =
    2;

  comp.attack.value =
    0.015;

  comp.release.value =
    0.18;


  const lim =
    offline.createDynamicsCompressor();

  lim.threshold.value =
    -1;

  lim.knee.value =
    0;

  lim.ratio.value =
    20;

  lim.attack.value =
    0.001;

  lim.release.value =
    0.08;


  const gain =
    offline.createGain();

  gain.gain.value =
    dbToGain(
      Number(master.value)
    );


  const dryGain =
    offline.createGain();

  dryGain.gain.value =
    1 -
    Number(intensity.value) / 100;


  const wetGain =
    offline.createGain();

  wetGain.gain.value =
    Number(intensity.value) / 100;


  source.connect(
    dryGain
  );

  source.connect(
    bassNode
  );

  bassNode.connect(
    midNode
  );

  midNode.connect(
    trebleNode
  );

  trebleNode.connect(
    comp
  );

  comp.connect(
    lim
  );

  lim.connect(
    gain
  );

  gain.connect(
    wetGain
  );

  dryGain.connect(
    offline.destination
  );

  wetGain.connect(
    offline.destination
  );


  source.start(0);


  setProgress(
    0,
    "МАСТЕРИНГ...",
    true
  );

  const rendered =
    await offline.startRendering();

  finishProgress();

  return rendered;

}


/* =========================================================
   WAV
========================================================= */

function writeAscii(
  view,
  offset,
  text
){

  for(
    let i = 0;
    i < text.length;
    i++
  ){

    view.setUint8(
      offset + i,
      text.charCodeAt(i)
    );

  }

}


function encodeWav(
  buffer,
  bitDepth
){

  const channels =
    buffer.numberOfChannels;

  const sampleRate =
    buffer.sampleRate;

  const frameCount =
    buffer.length;

  const isFloat =
    bitDepth === 32;

  const bytesPerSample =
    bitDepth / 8;

  const blockAlign =
    channels *
    bytesPerSample;

  const dataSize =
    frameCount *
    blockAlign;

  const arrayBuffer =
    new ArrayBuffer(
      44 + dataSize
    );

  const view =
    new DataView(
      arrayBuffer
    );


  writeAscii(
    view,
    0,
    "RIFF"
  );

  view.setUint32(
    4,
    36 + dataSize,
    true
  );

  writeAscii(
    view,
    8,
    "WAVE"
  );


  writeAscii(
    view,
    12,
    "fmt "
  );

  view.setUint32(
    16,
    16,
    true
  );

  view.setUint16(
    20,
    isFloat ? 3 : 1,
    true
  );

  view.setUint16(
    22,
    channels,
    true
  );

  view.setUint32(
    24,
    sampleRate,
    true
  );

  view.setUint32(
    28,
    sampleRate *
    blockAlign,
    true
  );

  view.setUint16(
    32,
    blockAlign,
    true
  );

  view.setUint16(
    34,
    bitDepth,
    true
  );


  writeAscii(
    view,
    36,
    "data"
  );

  view.setUint32(
    40,
    dataSize,
    true
  );


  const channelData = [];

  for(
    let ch = 0;
    ch < channels;
    ch++
  ){

    channelData.push(
      buffer.getChannelData(ch)
    );

  }


  let offset = 44;

  for(
    let i = 0;
    i < frameCount;
    i++
  ){

    for(
      let ch = 0;
      ch < channels;
      ch++
    ){

      let sample =
        channelData[ch][i];

      sample =
        Math.max(
          -1,
          Math.min(
            1,
            sample
          )
        );


      if(isFloat){

        view.setFloat32(
          offset,
          sample,
          true
        );

        offset += 4;

      }else if(bitDepth === 24){

        let value =
          Math.round(
            sample < 0
              ? sample * 8388608
              : sample * 8388607
          );

        if(value < 0){
          value += 16777216;
        }

        view.setUint8(
          offset,
          value & 0xff
        );

        view.setUint8(
          offset + 1,
          (value >> 8) & 0xff
        );

        view.setUint8(
          offset + 2,
          (value >> 16) & 0xff
        );

        offset += 3;

      }else{

        const value =
          sample < 0
            ? sample * 32768
            : sample * 32767;

        view.setInt16(
          offset,
          Math.round(value),
          true
        );

        offset += 2;

      }

    }

  }

  return new Blob(
    [arrayBuffer],
    {
      type:"audio/wav"
    }
  );

}


/* =========================================================
   MP3
========================================================= */

function floatTo16BitPCM(
  buffer,
  channel
){

  const data =
    buffer.getChannelData(
      channel
    );

  const result =
    new Int16Array(
      data.length
    );

  for(
    let i = 0;
    i < data.length;
    i++
  ){

    let sample =
      Math.max(
        -1,
        Math.min(
          1,
          data[i]
        )
      );

    result[i] =
      sample < 0
        ? sample * 32768
        : sample * 32767;

  }

  return result;

}


function encodeMp3(
  buffer,
  kbps
){

  if(
    typeof lamejs === "undefined"
  ){

    throw new Error(
      "Библиотека MP3-кодирования не загрузилась."
    );

  }

  const channels =
    Math.min(
      2,
      buffer.numberOfChannels
    );

  const sampleRate =
    buffer.sampleRate;

  const encoder =
    new lamejs.Mp3Encoder(
      channels,
      sampleRate,
      Number(kbps)
    );

  const left =
    floatTo16BitPCM(
      buffer,
      0
    );

  const right =
    channels > 1
      ? floatTo16BitPCM(
          buffer,
          1
        )
      : null;

  const sampleBlock =
    1152;

  const mp3Data = [];

  for(
    let i = 0;
    i < left.length;
    i += sampleBlock
  ){

    const leftChunk =
      left.subarray(
        i,
        Math.min(
          i + sampleBlock,
          left.length
        )
      );

    let encoded;

    if(channels === 2){

      const rightChunk =
        right.subarray(
          i,
          Math.min(
            i + sampleBlock,
            right.length
          )
        );

      encoded =
        encoder.encodeBuffer(
          leftChunk,
          rightChunk
        );

    }else{

      encoded =
        encoder.encodeBuffer(
          leftChunk
        );

    }

    if(encoded.length > 0){

      mp3Data.push(
        encoded
      );

    }

    if(
      i % (sampleBlock * 20) === 0
    ){

      const percent =
        Math.round(
          (i / left.length) * 100
        );

      setProgress(
        percent,
        "КОДИРОВАНИЕ MP3..."
      );

    }

  }


  const end =
    encoder.flush();

  if(end.length > 0){

    mp3Data.push(
      end
    );

  }

  return new Blob(
    mp3Data,
    {
      type:"audio/mpeg"
    }
  );

}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadBlob(
  blob,
  filename
){

  const url =
    URL.createObjectURL(
      blob
    );

  const a =
    document.createElement(
      "a"
    );

  a.href =
    url;

  a.download =
    filename;

  document.body.appendChild(
    a
  );

  a.click();

  a.remove();

  setTimeout(
    () =>
      URL.revokeObjectURL(
        url
      ),
    1500
  );

}

  try{

    setProgress(
      5,
      "ПОДГОТОВКА MP3..."
    );

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          50
        )
    );


    const mastered =
      await renderMasteredAudio();


    setProgress(
      65,
      "КОДИРОВАНИЕ MP3..."
    );


    const mp3 =
      encodeMp3(
        mastered,
        Number(
          mp3Quality.value
        )
      );


    setProgress(
      92,
      "ДОБАВЛЕНИЕ ID3..."
    );


    const cleanedOriginalId3 =
      filterHiddenAiFromId3(
        originalId3Bytes
      );

    const id3 =
      ensureCopyrightInId3(
        cleanedOriginalId3
      ) ||
      createCleanId3Tag();


    const finalBlob =
      new Blob(
        [
          id3,
          mp3
        ],
        {
          type:"audio/mpeg"
        }
      );


    setProgress(
      97,
      "СОХРАНЕНИЕ..."
    );


    downloadBlob(
      finalBlob,
      makeFileName("mp3")
    );


    finishProgress();

    progressText.textContent =
      "MP3 СОХРАНЁН";

    status.textContent =
      "MP3 ГОТОВ";


  }catch(error){

    console.error(error);

    status.textContent =
      "ОШИБКА MP3";

    setProgress(
      0,
      "ОШИБКА"
    );

    alert(
      "Ошибка сохранения MP3:\n\n" +
      error.message
    );


  }finally{

    exporting = false;

    exportMp3.disabled =
      !audioBuffer;

    exportWav.disabled =
      !audioBuffer;

  }

}


/* =========================================================
   WAV EXPORT
========================================================= */

async function exportWavFile(){

  if(
    !audioBuffer ||
    exporting
  ){
    return;
  }

  exporting = true;

  exportMp3.disabled =
    true;

  exportWav.disabled =
    true;


  try{

    setProgress(
      5,
      "ПОДГОТОВКА WAV..."
    );


    const mastered =
      await renderMasteredAudio();


    setProgress(
      70,
      "СОЗДАНИЕ WAV..."
    );


    const bitDepth =
      Number(
        wavQuality.value
      );


    const wav =
      encodeWav(
        mastered,
        bitDepth
      );


    setProgress(
      95,
      "СОХРАНЕНИЕ..."
    );


    downloadBlob(
      wav,
      makeFileName("wav")
    );


    finishProgress();

    progressText.textContent =
      "WAV СОХРАНЁН";

    status.textContent =
      "WAV ГОТОВ";


  }catch(error){

    console.error(error);

    status.textContent =
      "ОШИБКА WAV";

    setProgress(
      0,
      "ОШИБКА"
    );

    alert(
      "Ошибка сохранения WAV:\n\n" +
      error.message
    );


  }finally{

    exporting = false;

    exportMp3.disabled =
      !audioBuffer;

    exportWav.disabled =
      !audioBuffer;

  }

}


/* =========================================================
   EVENTS
========================================================= */

fileInput.addEventListener(
  "change",
  async event => {

    const file =
      event.target.files &&
      event.target.files[0];

    await loadAudioFile(
      file
    );

  }
);


playButton.addEventListener(
  "click",
  async () => {

    try{

      await togglePlayback();

    }catch(error){

      console.error(error);

      alert(
        "Ошибка воспроизведения:\n\n" +
        error.message
      );

    }

  }
);


abButton.addEventListener(
  "click",
  () => {

    switchMode(
      activeMode === "A"
        ? "B"
        : "A"
    );

  }
);


modeA.addEventListener(
  "click",
  () =>
    switchMode("A")
);


modeB.addEventListener(
  "click",
  () =>
    switchMode("B")
);


[
  bass,
  mid,
  treble,
  intensity,
  master
].forEach(
  control => {

    control.addEventListener(
      "input",
      () => {

        updateControlLabels();

        updateAudioProcessing();

        if(
          preset.value !==
          "manual"
        ){

          preset.value =
            "manual";

        }

      }
    );

  }
);


preset.addEventListener(
  "change",
  () => {

    applyPreset(
      preset.value
    );

  }
);


randomIdButton.addEventListener(
  "click",
  () => {

    uuidInput.value =
      generateMusicBrainzTrackId();

  }
);


exportMp3.addEventListener(
  "click",
  exportMp3File
);


exportWav.addEventListener(
  "click",
  exportWavFile
);


/* =========================================================
   SPACE = PLAY / PAUSE
========================================================= */

document.addEventListener(
  "keydown",
  async event => {

    if(
      event.code !== "Space"
    ){
      return;
    }

    const tag =
      document.activeElement &&
      document.activeElement.tagName;

    if(
      tag === "INPUT" ||
      tag === "TEXTAREA" ||
      tag === "SELECT"
    ){
      return;
    }

    event.preventDefault();

    if(!audioBuffer){
      return;
    }

    try{

      await togglePlayback();

    }catch(error){

      console.error(error);

    }

  }
);


/* =========================================================
   INITIALIZATION
========================================================= */

resetMetadata();

applyPreset(
  "clear-studio"
);

updateControlLabels();

resetProgress();


/* =========================================================
   START VK BRIDGE
========================================================= */

initVKBridge();

</script>
