<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MUZER play</title>

<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.all.min.js"></script>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:
        linear-gradient(rgba(20,15,10,.94),rgba(20,15,10,.97)),
        repeating-linear-gradient(
            90deg,
            #3a2416 0,
            #3a2416 8px,
            #422a1a 9px,
            #2e1c11 18px
        );
    color:#eee;
}

body{
    padding:14px;
}

.app{
    width:100%;
    max-width:1200px;
    margin:auto;
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px 18px;
    margin-bottom:12px;
    border:1px solid #5f4128;
    border-radius:12px;
    background:linear-gradient(180deg,#302116,#21170f);
    box-shadow:0 8px 25px rgba(0,0,0,.4);
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:2px;
    color:#ff9f32;
}

.status{
    font-size:12px;
    color:#aaa;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.panel{
    border:1px solid #5f4128;
    border-radius:12px;
    padding:15px;
    background:linear-gradient(180deg,#2b1d13,#1e1510);
    box-shadow:0 8px 25px rgba(0,0,0,.35);
}

.panel h2{
    margin:0 0 14px;
    font-size:15px;
    color:#ff9f32;
    text-transform:uppercase;
    letter-spacing:1px;
}

.file-box{
    border:1px dashed #8a6037;
    border-radius:10px;
    padding:15px;
    text-align:center;
    background:#17100c;
    margin-bottom:12px;
}

input[type=file]{
    width:100%;
    color:#ccc;
}

.file-name{
    margin-top:10px;
    font-size:12px;
    color:#aaa;
    word-break:break-all;
}

.controls{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:14px;
}

button,
select,
input[type=text],
input[type=number]{
    border:1px solid #674727;
    border-radius:7px;
    background:#21160f;
    color:#eee;
    padding:9px 10px;
    outline:none;
}

button{
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#3a2718;
}

button.active{
    background:#b86116;
    border-color:#e88425;
}

button.primary{
    background:#b86116;
    border-color:#e88425;
}

button.primary:hover{
    background:#d1711b;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.control{
    margin-bottom:13px;
}

.control-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:5px;
}

label{
    font-size:12px;
    color:#bbb;
}

.value{
    color:#ffad45;
    font-size:12px;
}

input[type=range]{
    width:100%;
    accent-color:#e4771b;
}

.meta-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.field.full{
    grid-column:1/-1;
}

.field input{
    width:100%;
}

.export-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
}

.export-box{
    border:1px solid #503720;
    border-radius:9px;
    padding:10px;
    background:#17100c;
}

.export-box strong{
    display:block;
    color:#ff9f32;
    font-size:12px;
    margin-bottom:7px;
}

.export-row{
    display:flex;
    gap:6px;
}

.export-row select{
    flex:1;
}

.progress-wrap{
    margin-top:15px;
}

.progress{
    width:100%;
    height:8px;
    background:#100c09;
    border-radius:10px;
    overflow:hidden;
    border:1px solid #3e2a1b;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#e4771b;
    transition:width .08s linear;
}

.time{
    display:flex;
    justify-content:space-between;
    color:#999;
    font-size:11px;
    margin-top:5px;
}

.footer{
    text-align:center;
    color:#777;
    font-size:11px;
    padding:14px;
}

@media(max-width:800px){
    .grid{
        grid-template-columns:1fr;
    }

    .meta-grid{
        grid-template-columns:1fr;
    }

    .export-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="status" id="status">Готов</div>
    </div>

    <div class="grid">

        <!-- LEFT -->
        <section class="panel">

            <h2>Аудио</h2>

            <div class="file-box">
                <input id="fileInput" type="file" accept="audio/*">
                <div class="file-name" id="fileName">
                    Файл не выбран
                </div>
            </div>

            <div class="controls">
                <button id="playBtn" class="primary" disabled>
                    ▶ PLAY
                </button>

                <button id="abBtn" disabled>
                    A/B: PROCESSED
                </button>

                <button id="modeBtn" disabled>
                    MODE A/B
                </button>
            </div>

            <h2>Mastering</h2>

            <div class="control">
                <div class="control-row">
                    <label>Bass</label>
                    <span class="value" id="bassValue">0 dB</span>
                </div>
                <input id="bass" type="range" min="-12" max="12" step=".1" value="0">
            </div>

            <div class="control">
                <div class="control-row">
                    <label>Mid</label>
                    <span class="value" id="midValue">0 dB</span>
                </div>
                <input id="mid" type="range" min="-12" max="12" step=".1" value="0">
            </div>

            <div class="control">
                <div class="control-row">
                    <label>Treble</label>
                    <span class="value" id="trebleValue">0 dB</span>
                </div>
                <input id="treble" type="range" min="-12" max="12" step=".1" value="0">
            </div>

            <div class="control">
                <div class="control-row">
                    <label>Intensity</label>
                    <span class="value" id="intensityValue">50%</span>
                </div>
                <input id="intensity" type="range" min="0" max="100" step="1" value="50">
            </div>

            <div class="control">
                <div class="control-row">
                    <label>Master</label>
                    <span class="value" id="masterValue">0 dB</span>
                </div>
                <input id="master" type="range" min="-12" max="6" step=".1" value="0">
            </div>

            <div class="control">
                <label>Preset</label>
                <select id="preset" style="width:100%;margin-top:5px">
                    <option value="manual">Manual</option>
                    <option value="balanced">Balanced</option>
                    <option value="warm">Warm</option>
                    <option value="bright">Bright</option>
                    <option value="clear-studio">Clear Studio</option>
                </select>
            </div>

            <div class="progress-wrap">
                <div class="progress">
                    <div class="progress-bar" id="progressBar"></div>
                </div>

                <div class="time">
                    <span id="currentTime">00:00</span>
                    <span id="duration">00:00</span>
                </div>
            </div>

        </section>

        <!-- RIGHT -->
        <section class="panel">

            <h2>Metadata</h2>

            <div class="meta-grid">

                <div class="field full">
                    <label>Title</label>
                    <input id="title" type="text" placeholder="Название трека">
                </div>

                <div class="field">
                    <label>Artist</label>
                    <input id="artist" type="text" value="MUZER play">
                </div>

                <div class="field">
                    <label>Album</label>
                    <input id="album" type="text" value="MUZER play">
                </div>

                <div class="field">
                    <label>Track Number</label>
                    <input id="trackNumber" type="number" min="1" value="1">
                </div>

                <div class="field">
                    <label>Composer</label>
                    <input id="composer" type="text" value="MUZER play">
                </div>

                <div class="field">
                    <label>Album Artist</label>
                    <input id="albumArtist" type="text" value="MUZER play">
                </div>

                <div class="field">
                    <label>MusicBrainz Track ID</label>
                    <input id="musicbrainz" type="text">
                </div>

                <div class="field">
                    <label>Random ID</label>
                    <input id="randomId" type="text">
                </div>

            </div>

            <div class="export-grid">

                <div class="export-box">
                    <strong>MP3 EXPORT</strong>

                    <div class="export-row">
                        <select id="mp3Bitrate">
                            <option value="320">320 kbps</option>
                            <option value="256">256 kbps</option>
                            <option value="192">192 kbps</option>
                            <option value="160">160 kbps</option>
                            <option value="128">128 kbps</option>
                        </select>

                        <button id="mp3Btn" disabled>
                            MP3
                        </button>
                    </div>
                </div>

                <div class="export-box">
                    <strong>WAV EXPORT</strong>

                    <div class="export-row">
                        <select id="wavFormat">
                            <option value="16">16 bit</option>
                            <option value="24">24 bit</option>
                            <option value="32">32 bit float</option>
                        </select>

                        <button id="wavBtn" disabled>
                            WAV
                        </button>
                    </div>
                </div>

            </div>

        </section>

    </div>

    <div class="footer">
        MUZER play · Audio
    </div>

</div>

<script>
"use strict";

/* =========================================================
   CONSTANTS
========================================================= */

const DEFAULT_ARTIST = "MUZER play";
const DEFAULT_COMPOSER = "MUZER play";
const DEFAULT_ALBUM_ARTIST = "MUZER play";

let audioContext = null;
let sourceNode = null;

let originalBuffer = null;
let audioElement = null;

let isPlaying = false;
let processedMode = true;

let startTime = 0;
let pauseOffset = 0;

let lowshelf = null;
let midEQ = null;
let highshelf = null;
let compressor = null;
let masterGain = null;
let processedGain = null;

/* =========================================================
   DOM
========================================================= */

const fileInput = document.getElementById("fileInput");
const fileName = document.getElementById("fileName");
const statusEl = document.getElementById("status");

const playBtn = document.getElementById("playBtn");
const abBtn = document.getElementById("abBtn");
const modeBtn = document.getElementById("modeBtn");

const bass = document.getElementById("bass");
const mid = document.getElementById("mid");
const treble = document.getElementById("treble");
const intensity = document.getElementById("intensity");
const master = document.getElementById("master");

const bassValue = document.getElementById("bassValue");
const midValue = document.getElementById("midValue");
const trebleValue = document.getElementById("trebleValue");
const intensityValue = document.getElementById("intensityValue");
const masterValue = document.getElementById("masterValue");

const preset = document.getElementById("preset");

const titleInput = document.getElementById("title");
const artistInput = document.getElementById("artist");
const albumInput = document.getElementById("album");
const trackNumberInput = document.getElementById("trackNumber");
const composerInput = document.getElementById("composer");
const albumArtistInput = document.getElementById("albumArtist");
const musicbrainzInput = document.getElementById("musicbrainz");
const randomIdInput = document.getElementById("randomId");

const mp3Bitrate = document.getElementById("mp3Bitrate");
const wavFormat = document.getElementById("wavFormat");

const mp3Btn = document.getElementById("mp3Btn");
const wavBtn = document.getElementById("wavBtn");

const progressBar = document.getElementById("progressBar");
const currentTimeEl = document.getElementById("currentTime");
const durationEl = document.getElementById("duration");

/* =========================================================
   HELPERS
========================================================= */

function uuidv4(){
    if(window.crypto && crypto.randomUUID){
        return crypto.randomUUID();
    }

    if(window.crypto && crypto.getRandomValues){
        const bytes = new Uint8Array(16);
        crypto.getRandomValues(bytes);

        bytes[6] = (bytes[6] & 0x0f) | 0x40;
        bytes[8] = (bytes[8] & 0x3f) | 0x80;

        return [...bytes].map((b,i)=>{
            const s = b.toString(16).padStart(2,"0");
            return ([4,6,8,10].includes(i) ? "-" : "") + s;
        }).join("");
    }

    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{
        const r = Math.random()*16|0;
        const v = c === "x" ? r : (r&3)|8;
        return v.toString(16);
    });
}

function formatTime(seconds){
    if(!Number.isFinite(seconds)){
        return "00:00";
    }

    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);

    return String(m).padStart(2,"0") + ":" +
           String(s).padStart(2,"0");
}

function dbToGain(db){
    return Math.pow(10,db/20);
}

function setStatus(text){
    statusEl.textContent = text;
}

function filename(ext){
    const artist =
        artistInput.value.trim() || DEFAULT_ARTIST;

    const title =
        titleInput.value.trim() || "Untitled";

    return `${artist} - ${title}.${ext}`;
}

function resetProgress(){
    progressBar.style.width = "0%";
    currentTimeEl.textContent = "00:00";
    durationEl.textContent = "00:00";
}

/* =========================================================
   METADATA
========================================================= */

function resetMetadata(){
    titleInput.value = "";
    artistInput.value = DEFAULT_ARTIST;
    albumInput.value = DEFAULT_ARTIST;
    trackNumberInput.value = "1";
    composerInput.value = DEFAULT_COMPOSER;
    albumArtistInput.value = DEFAULT_ALBUM_ARTIST;
    musicbrainzInput.value = "";
    randomIdInput.value = uuidv4();
}

function cleanText(value){
    return String(value || "")
        .replace(/\0/g,"")
        .trim();
}

/* =========================================================
   ID3 READER
========================================================= */

function readSynchsafe(bytes){
    return (
        ((bytes[0] & 0x7f) << 21) |
        ((bytes[1] & 0x7f) << 14) |
        ((bytes[2] & 0x7f) << 7) |
        (bytes[3] & 0x7f)
    );
}

function decodeText(bytes){
    if(!bytes || !bytes.length){
        return "";
    }

    const encoding = bytes[0];

    try{
        if(encoding === 0){
            return new TextDecoder("iso-8859-1")
                .decode(bytes.slice(1))
                .replace(/\0/g,"")
                .trim();
        }

        if(encoding === 1){
            return new TextDecoder("utf-16")
                .decode(bytes.slice(1))
                .replace(/\0/g,"")
                .trim();
        }

        if(encoding === 2){
            return new TextDecoder("utf-16be")
                .decode(bytes.slice(1))
                .replace(/\0/g,"")
                .trim();
        }

        return new TextDecoder("utf-8")
            .decode(bytes.slice(1))
            .replace(/\0/g,"")
            .trim();

    }catch{
        return "";
    }
}

function parseID3(buffer){
    const bytes = new Uint8Array(buffer);

    if(
        bytes.length < 10 ||
        bytes[0] !== 0x49 ||
        bytes[1] !== 0x44 ||
        bytes[2] !== 0x33
    ){
        return {};
    }

    const version = bytes[3];
    const size = readSynchsafe(bytes.slice(6,10));

    let offset = 10;
    const end = Math.min(bytes.length,10 + size);

    const result = {};

    while(offset + 10 <= end){

        const id = String.fromCharCode(
            bytes[offset],
            bytes[offset+1],
            bytes[offset+2],
            bytes[offset+3]
        );

        let frameSize;

        if(version >= 4){
            frameSize = readSynchsafe(
                bytes.slice(offset+4,offset+8)
            );
        }else{
            frameSize =
                (bytes[offset+4] << 24) |
                (bytes[offset+5] << 16) |
                (bytes[offset+6] << 8) |
                bytes[offset+7];
        }

        if(!frameSize || offset + 10 + frameSize > end){
            break;
        }

        const data = bytes.slice(
            offset + 10,
            offset + 10 + frameSize
        );

        if(id === "TIT2"){
            result.title = decodeText(data);
        }

        if(id === "TPE1"){
            result.artist = decodeText(data);
        }

        if(id === "TCOM"){
            result.composer = decodeText(data);
        }

        offset += 10 + frameSize;
    }

    return result;
}

/* =========================================================
   AUDIO GRAPH
========================================================= */

async function ensureAudioContext(){

    if(!audioContext){
        audioContext = new AudioContext();

        lowshelf =
            audioContext.createBiquadFilter();

        lowshelf.type = "lowshelf";
        lowshelf.frequency.value = 120;

        midEQ =
            audioContext.createBiquadFilter();

        midEQ.type = "peaking";
        midEQ.frequency.value = 1000;
        midEQ.Q.value = .8;

        highshelf =
            audioContext.createBiquadFilter();

        highshelf.type = "highshelf";
        highshelf.frequency.value = 6500;

        compressor =
            audioContext.createDynamicsCompressor();

        compressor.threshold.value = -10;
        compressor.knee.value = 10;
        compressor.ratio.value = 3;
        compressor.attack.value = .003;
        compressor.release.value = .12;

        processedGain =
            audioContext.createGain();

        masterGain =
            audioContext.createGain();

        lowshelf.connect(midEQ);
        midEQ.connect(highshelf);
        highshelf.connect(compressor);
        compressor.connect(masterGain);
        masterGain.connect(processedGain);
        processedGain.connect(audioContext.destination);

        updateAudioParameters();
    }

    if(audioContext.state === "suspended"){
        await audioContext.resume();
    }
}

function updateAudioParameters(){

    if(!audioContext){
        return;
    }

    lowshelf.gain.value =
        Number(bass.value);

    midEQ.gain.value =
        Number(mid.value);

    highshelf.gain.value =
        Number(treble.value);

    masterGain.gain.value =
        dbToGain(Number(master.value));

    processedGain.gain.value =
        processedMode ? 1 : 0;
}

/* =========================================================
   PRESETS
========================================================= */

const presets = {

    manual:{
        bass:0,
        mid:0,
        treble:0,
        intensity:50,
        master:0
    },

    balanced:{
        bass:2,
        mid:0,
        treble:2,
        intensity:55,
        master:-1
    },

    warm:{
        bass:4,
        mid:1,
        treble:-2,
        intensity:60,
        master:-1
    },

    bright:{
        bass:1,
        mid:0,
        treble:5,
        intensity:60,
        master:-2
    },

    "clear-studio":{
        bass:1,
        mid:0,
        treble:3,
        intensity:45,
        master:-2
    }
};

function applyPreset(name){

    const p = presets[name];

    if(!p){
        return;
    }

    bass.value = p.bass;
    mid.value = p.mid;
    treble.value = p.treble;
    intensity.value = p.intensity;
    master.value = p.master;

    updateControlLabels();
    updateAudioParameters();
}

function updateControlLabels(){

    bassValue.textContent =
        `${Number(bass.value).toFixed(1)} dB`;

    midValue.textContent =
        `${Number(mid.value).toFixed(1)} dB`;

    trebleValue.textContent =
        `${Number(treble.value).toFixed(1)} dB`;

    intensityValue.textContent =
        `${intensity.value}%`;

    masterValue.textContent =
        `${Number(master.value).toFixed(1)} dB`;
}

/* =========================================================
   PLAYBACK
========================================================= */

async function stopPlayback(){

    if(sourceNode){
        try{
            sourceNode.stop();
        }catch{}

        sourceNode.disconnect();
        sourceNode = null;
    }

    isPlaying = false;
    pauseOffset = 0;

    playBtn.textContent = "▶ PLAY";
}

async function startPlayback(){

    if(!originalBuffer){
        return;
    }

    await ensureAudioContext();

    await stopPlayback();

    sourceNode =
        audioContext.createBufferSource();

    sourceNode.buffer = originalBuffer;

    if(processedMode){
        sourceNode.connect(lowshelf);
    }else{
        sourceNode.connect(
            audioContext.destination
        );
    }

    const offset =
        Math.min(
            pauseOffset,
            Math.max(0,originalBuffer.duration-.001)
        );

    startTime =
        audioContext.currentTime - offset;

    sourceNode.start(0,offset);

    isPlaying = true;

    playBtn.textContent = "⏸ PAUSE";

    sourceNode.onended = ()=>{
        if(isPlaying){
            isPlaying = false;
            pauseOffset = 0;
            playBtn.textContent = "▶ PLAY";
        }
    };

    updateProgress();
}

async function togglePlayback(){

    if(!originalBuffer){
        return;
    }

    if(isPlaying){

        pauseOffset =
            audioContext.currentTime - startTime;

        await stopPlayback();

        return;
    }

    await startPlayback();
}

function updateProgress(){

    if(!isPlaying || !originalBuffer){
        return;
    }

    const current =
        audioContext.currentTime - startTime;

    const duration =
        originalBuffer.duration;

    const percent =
        Math.min(100,Math.max(0,current/duration*100));

    progressBar.style.width =
        percent + "%";

    currentTimeEl.textContent =
        formatTime(current);

    durationEl.textContent =
        formatTime(duration);

    requestAnimationFrame(updateProgress);
}

async function switchAB(){

    processedMode = !processedMode;

    abBtn.textContent =
        processedMode
            ? "A/B: PROCESSED"
            : "A/B: ORIGINAL";

    if(isPlaying){
        pauseOffset =
            audioContext.currentTime - startTime;

        await startPlayback();
    }else{
        updateAudioParameters();
    }
}

async function toggleMode(){

    await switchAB();
}

/* =========================================================
   FILE LOAD
========================================================= */

fileInput.addEventListener("change",async()=>{

    const file = fileInput.files[0];

    if(!file){
        return;
    }

    try{

        setStatus("Загрузка...");

        fileName.textContent = file.name;

        const arrayBuffer =
            await file.arrayBuffer();

        const metadata =
            parseID3(arrayBuffer);

        if(metadata.title){
            titleInput.value =
                metadata.title;
        }

        if(metadata.artist){
            artistInput.value =
                metadata.artist;
        }

        if(metadata.composer){
            composerInput.value =
                metadata.composer;
        }

        if(!titleInput.value.trim()){
            titleInput.value =
                file.name
                    .replace(/\.[^/.]+$/,"")
                    .replace(/_/g," ");
        }

        randomIdInput.value =
            uuidv4();

        await ensureAudioContext();

        originalBuffer =
            await audioContext.decodeAudioData(
                arrayBuffer.slice(0)
            );

        playBtn.disabled = false;
        abBtn.disabled = false;
        modeBtn.disabled = false;
        mp3Btn.disabled = false;
        wavBtn.disabled = false;

        pauseOffset = 0;

        durationEl.textContent =
            formatTime(originalBuffer.duration);

        progressBar.style.width = "0%";

        setStatus("Готово");

    }catch(error){

        console.error(error);

        setStatus("Ошибка загрузки");

        alert(

/* =========================================================
   OFFLINE MASTERING
========================================================= */

async function renderMasteredBuffer(){

    if(!originalBuffer){
        throw new Error("Нет аудиофайла");
    }

    const channels =
        originalBuffer.numberOfChannels;

    const sampleRate =
        originalBuffer.sampleRate;

    const offline =
        new OfflineAudioContext(
            channels,
            originalBuffer.length,
            sampleRate
        );

    const source =
        offline.createBufferSource();

    source.buffer = originalBuffer;

    const low =
        offline.createBiquadFilter();

    low.type = "lowshelf";
    low.frequency.value = 120;
    low.gain.value =
        Number(bass.value);

    const middle =
        offline.createBiquadFilter();

    middle.type = "peaking";
    middle.frequency.value = 1000;
    middle.Q.value = .8;
    middle.gain.value =
        Number(mid.value);

    const high =
        offline.createBiquadFilter();

    high.type = "highshelf";
    high.frequency.value = 6500;
    high.gain.value =
        Number(treble.value);

    const comp =
        offline.createDynamicsCompressor();

    const intensityValue =
        Number(intensity.value);

    const compression =
        intensityValue / 100;

    comp.threshold.value =
        -6 - compression * 18;

    comp.knee.value =
        8 + compression * 20;

    comp.ratio.value =
        1.5 + compression * 6;

    comp.attack.value =
        .003;

    comp.release.value =
        .12;

    const gain =
        offline.createGain();

    gain.gain.value =
        dbToGain(Number(master.value));

    source.connect(low);
    low.connect(middle);
    middle.connect(high);
    high.connect(comp);
    comp.connect(gain);
    gain.connect(offline.destination);

    source.start(0);

    return await offline.startRendering();
}

/* =========================================================
   WAV ENCODER
========================================================= */

function writeString(view,offset,string){

    for(let i=0;i<string.length;i++){
        view.setUint8(
            offset+i,
            string.charCodeAt(i)
        );
    }
}

function encodeWAV(buffer,bitDepth){

    const channels =
        buffer.numberOfChannels;

    const sampleRate =
        buffer.sampleRate;

    const float32 =
        bitDepth === 32;

    const bytesPerSample =
        float32 ? 4 : bitDepth / 8;

    const blockAlign =
        channels * bytesPerSample;

    const dataSize =
        buffer.length * blockAlign;

    const arrayBuffer =
        new ArrayBuffer(
            44 + dataSize
        );

    const view =
        new DataView(arrayBuffer);

    writeString(view,0,"RIFF");
    view.setUint32(
        4,
        36 + dataSize,
        true
    );

    writeString(view,8,"WAVE");
    writeString(view,12,"fmt ");

    view.setUint32(16,16,true);

    view.setUint16(
        20,
        float32 ? 3 : 1,
        true
    );

    view.setUint16(
        22,
        channels,
        true
    );

    view.setUint32(
        24,
        sampleRate,
        true
    );

    view.setUint32(
        28,
        sampleRate * blockAlign,
        true
    );

    view.setUint16(
        32,
        blockAlign,
        true
    );

    view.setUint16(
        34,
        bitDepth,
        true
    );

    writeString(view,36,"data");

    view.setUint32(
        40,
        dataSize,
        true
    );

    let offset = 44;

    for(
        let i=0;
        i<buffer.length;
        i++
    ){

        for(
            let ch=0;
            ch<channels;
            ch++
        ){

            const data =
                buffer.getChannelData(ch);

            let sample =
                Math.max(
                    -1,
                    Math.min(1,data[i])
                );

            if(float32){

                view.setFloat32(
                    offset,
                    sample,
                    true
                );

                offset += 4;

            }else if(bitDepth === 16){

                const value =
                    sample < 0
                        ? sample * 32768
                        : sample * 32767;

                view.setInt16(
                    offset,
                    value,
                    true
                );

                offset += 2;

            }else{

                const value =
                    sample < 0
                        ? sample * 8388608
                        : sample * 8388607;

                let v =
                    Math.round(value);

                if(v < 0){
                    v += 16777216;
                }

                view.setUint8(
                    offset,
                    v & 255
                );

                view.setUint8(
                    offset+1,
                    (v >> 8) & 255
                );

                view.setUint8(
                    offset+2,
                    (v >> 16) & 255
                );

                offset += 3;
            }
        }
    }

    return new Blob(
        [arrayBuffer],
        {type:"audio/wav"}
    );
}

/* =========================================================
   ID3 WRITER
========================================================= */

function synchsafe(size){

    return new Uint8Array([
        (size >> 21) & 0x7f,
        (size >> 14) & 0x7f,
        (size >> 7) & 0x7f,
        size & 0x7f
    ]);
}

function textFrame(id,text){

    text = cleanText(text);

    const encoded =
        new TextEncoder().encode(text);

    const data =
        new Uint8Array(
            encoded.length + 1
        );

    data[0] = 3;

    data.set(encoded,1);

    const frame =
        new Uint8Array(
            10 + data.length
        );

    for(let i=0;i<4;i++){
        frame[i] =
            id.charCodeAt(i);
    }

    frame.set(
        synchsafe(data.length),
        4
    );

    frame.set(data,10);

    return frame;
}

function createCleanId3Tag(){

    const frames = [];

    frames.push(
        textFrame(
            "TIT2",
            titleInput.value
        )
    );

    frames.push(
        textFrame(
            "TPE1",
            artistInput.value ||
            DEFAULT_ARTIST
        )
    );

    frames.push(
        textFrame(
            "TALB",
            albumInput.value ||
            DEFAULT_ARTIST
        )
    );

    frames.push(
        textFrame(
            "TRCK",
            trackNumberInput.value || "1"
        )
    );

    frames.push(
        textFrame(
            "TCOM",
            composerInput.value ||
            DEFAULT_COMPOSER
        )
    );

    frames.push(
        textFrame(
            "TPE2",
            albumArtistInput.value ||
            DEFAULT_ALBUM_ARTIST
        )
    );

    frames.push(
        textFrame(
            "TCOP",
            "MUZER play"
        )
    );

    const mbid =
        cleanText(musicbrainzInput.value);

    if(mbid){
        frames.push(
            textFrame(
                "TXXX",
                "MusicBrainz Track ID: " + mbid
            )
        );
    }

    const randomId =
        cleanText(randomIdInput.value);

    if(randomId){
        frames.push(
            textFrame(
                "TXXX",
                "RANDOM_ID: " + randomId
            )
        );
    }

    let total = 0;

    frames.forEach(
        frame=>{
            total += frame.length;
        }
    );

    const header =
        new Uint8Array(10);

    header[0] = 0x49;
    header[1] = 0x44;
    header[2] = 0x33;

    header[3] = 4;
    header[4] = 0;
    header[5] = 0;

    header.set(
        synchsafe(total),
        6
    );

    const result =
        new Uint8Array(
            10 + total
        );

    result.set(header,0);

    let offset = 10;

    frames.forEach(frame=>{
        result.set(frame,offset);
        offset += frame.length;
    });

    return result;
}

/* =========================================================
   MP3 EXPORT
========================================================= */

function audioBufferToMp3(
    buffer,
    bitrate
){

    if(typeof lamejs === "undefined"){
        throw new Error(
            "LameJS не загружен"
        );
    }

    const channels =
        Math.min(
            2,
            buffer.numberOfChannels
        );

    const sampleRate =
        buffer.sampleRate;

    const encoder =
        new lamejs.Mp3Encoder(
            channels,
            sampleRate,
            bitrate
        );

    const left =
        buffer.getChannelData(0);

    const right =
        channels > 1
            ? buffer.getChannelData(1)
            : left;

    const sampleBlock = 1152;

    const mp3Data = [];

    for(
        let i=0;
        i<buffer.length;
        i += sampleBlock
    ){

        const end =
            Math.min(
                i + sampleBlock,
                buffer.length
            );

        const leftChunk =
            new Int16Array(
                end - i
            );

        const rightChunk =
            new Int16Array(
                end - i
            );

        for(
            let j=i;
            j<end;
            j++
        ){

            let l =
                Math.max(
                    -1,
                    Math.min(1,left[j])
                );

            let r =
                Math.max(
                    -1,
                    Math.min(1,right[j])
                );

            leftChunk[j-i] =
                l < 0
                    ? l * 32768
                    : l * 32767;

            rightChunk[j-i] =
                r < 0
                    ? r * 32768
                    : r * 32767;
        }

        let encoded;

        if(channels === 1){

            encoded =
                encoder.encodeBuffer(
                    leftChunk
                );

        }else{

            encoded =
                encoder.encodeBuffer(
                    leftChunk,
                    rightChunk
                );
        }

        if(encoded.length > 0){
            mp3Data.push(encoded);
        }
    }

    const final =
        encoder.flush();

    if(final.length > 0){
        mp3Data.push(final);
    }

    const id3 =
        createCleanId3Tag();

    return new Blob(
        [id3,...mp3Data],
        {type:"audio/mpeg"}
    );
}

/* =========================================================
   DOWNLOAD
========================================================= */

function downloadBlob(blob,name){

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;
    a.download = name;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(()=>{
        URL.revokeObjectURL(url);
    },1000);
}

    async()=>{

        if(!originalBuffer){
            return;
        }

        try{

            wavBtn.disabled = true;

            setStatus(
                "Рендеринг WAV..."
            );

            const rendered =
                await renderMasteredBuffer();

            const bits =
                Number(wavFormat.value);

            const blob =
                encodeWAV(
                    rendered,
                    bits
                );

            downloadBlob(
                blob,
                filename("wav")
            );

            setStatus(
                "WAV готов"
            );

        }catch(error){

            console.error(error);

            setStatus(
                "Ошибка WAV"
            );

            alert(
                "Ошибка экспорта WAV."
            );

        }finally{

            wavBtn.disabled = false;
        }
    }
);
